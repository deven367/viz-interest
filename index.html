<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compound interest graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Compound interest</h1>
      <p class="subtitle">Enter one or more annual rates (comma-separated) to compare curves on the same chart. Large axis labels are abbreviated when needed; summaries show full dollar amounts.</p>

      <section class="panel" aria-labelledby="controls-heading">
        <h2 id="controls-heading">Inputs</h2>
        <form class="controls" id="form">
          <div class="field">
            <label for="principal">Principal ($)</label>
            <input id="principal" type="number" min="0" step="100" value="10000" />
          </div>
          <div class="field field-wide">
            <label for="rates"
              >Annual rates (%)<span class="field-hint">0–100, comma-separated, e.g. 4, 6, 8</span></label
            >
            <input id="rates" type="text" value="4, 6, 8" placeholder="5 or 4, 6, 8" autocomplete="off" aria-describedby="rates-error" />
            <span class="field-hint" id="rates-error" role="alert" hidden></span>
          </div>
          <div class="field">
            <label for="years">Years</label>
            <input id="years" type="number" min="1" max="80" step="1" value="20" />
          </div>
          <div class="field">
            <label for="compound">Compound</label>
            <select id="compound">
              <option value="1">Annually</option>
              <option value="2">Semi-annually</option>
              <option value="4">Quarterly</option>
              <option value="12" selected>Monthly</option>
              <option value="365">Daily</option>
            </select>
          </div>
        </form>
      </section>

      <section class="chart-wrap" aria-label="Balance over time chart">
        <canvas
          id="chart"
          width="900"
          height="420"
          role="img"
          aria-label="Line chart comparing compound growth at different interest rates"
        ></canvas>
      </section>

      <div class="legend" id="legend" aria-live="polite"></div>

      <div class="summary" id="summary"></div>
    </main>

    <script>
      (function () {
        const canvas = document.getElementById("chart");
        const ctx = canvas.getContext("2d");
        const form = document.getElementById("form");
        const summary = document.getElementById("summary");
        const legendEl = document.getElementById("legend");
        const ratesInput = document.getElementById("rates");
        const ratesError = document.getElementById("rates-error");

        const COLORS = {
          bg: "#1a2332",
          grid: "#2d3a4f",
          text: "#8b9cb3",
          principal: "rgba(107, 140, 206, 0.5)",
        };

        const LINE_COLORS = [
          "#3ddc97",
          "#6b8cce",
          "#e8a849",
          "#e07c9e",
          "#9b7bed",
          "#5ec8e8",
          "#c4c879",
          "#7ac74f",
        ];

        function formatPct(pct) {
          const r = Math.round(pct * 100) / 100;
          const str = Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/\.?0+$/, "");
          return `${str}%`;
        }

        function parseRates(str) {
          const rows = [];
          const seen = new Set();
          // Reject the whole list rather than silently dropping or changing a rate.
          for (const part of String(str).split(/[,;]/).map((s) => s.trim())) {
            if (!/^(?:\d+(?:\.\d*)?|\.\d+)\s*%?$/.test(part)) return null;
            const pct = Number(part.replace(/%$/, "").trim());
            if (!Number.isFinite(pct) || pct > 100) return null;
            const key = Math.round(pct * 10000);
            if (seen.has(key)) continue;
            seen.add(key);
            rows.push({ pct, r: pct / 100 });
          }
          return rows;
        }

        function readInputs() {
          const P = Math.max(0, Number(document.getElementById("principal").value) || 0);
          const years = Math.max(1, Math.min(80, Number(document.getElementById("years").value) || 1));
          const n = Math.max(1, Number(document.getElementById("compound").value) || 12);
          const rateRows = parseRates(ratesInput.value);
          return { P, years, n, rateRows };
        }

        /** Balance at fractional year t (continuous timeline for plotting) */
        function balanceAt(P, r, n, t) {
          if (t <= 0) return P;
          if (r === 0) return P;
          return P * Math.pow(1 + r / n, n * t);
        }

        function buildSeries(P, r, n, years) {
          const steps = Math.max(years * 12, 24);
          const dt = years / steps;
          const points = [];
          for (let i = 0; i <= steps; i++) {
            const t = i * dt;
            points.push({ t, A: balanceAt(P, r, n, t) });
          }
          return points;
        }

        function formatMoney(x) {
          return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD",
            maximumFractionDigits: 0,
            minimumFractionDigits: 0,
          }).format(Math.round(x));
        }

        function draw() {
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          const w = Math.floor(rect.width * dpr);
          const h = Math.floor(rect.height * dpr);
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }

          const { P, years, n, rateRows } = readInputs();
          const error = rateRows ? "" : "Enter rates from 0 to 100, separated by commas (e.g. 4, 6, 8).";
          ratesInput.setCustomValidity(error);
          ratesInput.setAttribute("aria-invalid", String(!rateRows));
          ratesError.textContent = error;
          ratesError.hidden = !error;
          if (!rateRows) {
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, w, h);
            legendEl.innerHTML = "";
            summary.innerHTML = "";
            canvas.setAttribute("aria-label", "Chart unavailable: invalid annual rates.");
            return;
          }
          const seriesList = rateRows.map((row, i) => ({
            pct: row.pct,
            r: row.r,
            color: LINE_COLORS[i % LINE_COLORS.length],
            series: buildSeries(P, row.r, n, years),
            finalA: balanceAt(P, row.r, n, years),
          }));
          // A zero balance still needs a nonzero axis range.
          const maxY = Math.max(P, ...seriesList.map((s) => s.finalA)) * 1.08 || 1;

          canvas.setAttribute(
            "aria-label",
            `Compound balance over ${years} years at ${rateRows.map((row) => formatPct(row.pct)).join(", ")} compared to principal ${formatMoney(P)}.`
          );

          ctx.font = `${11 * dpr}px "JetBrains Mono", monospace`;
          const yTicks = 5;
          const yValues = Array.from({ length: yTicks + 1 }, (_, i) => maxY * (1 - i / yTicks));
          let yLabels = yValues.map(formatMoney);
          let labelWidth = Math.max(...yLabels.map((label) => ctx.measureText(label).width));
          // Keep most of the chart for plotting; summaries always retain full amounts.
          for (const notation of ["compact", "scientific"]) {
            if (labelWidth + 16 * dpr <= w * 0.35) break;
            const formatter = new Intl.NumberFormat("en-US", {
              style: "currency",
              currency: "USD",
              notation,
              maximumFractionDigits: 1,
              minimumFractionDigits: 0,
            });
            yLabels = yValues.map((value) => formatter.format(value));
            labelWidth = Math.max(...yLabels.map((label) => ctx.measureText(label).width));
          }
          const padL = Math.max(56 * dpr, labelWidth + 16 * dpr);
          const padR = 20 * dpr;
          const padT = 24 * dpr;
          const padB = 40 * dpr;
          const cw = w - padL - padR;
          const ch = h - padT - padB;

          ctx.fillStyle = COLORS.bg;
          ctx.fillRect(0, 0, w, h);

          // Grid + Y labels
          ctx.strokeStyle = COLORS.grid;
          ctx.lineWidth = 1 * dpr;
          ctx.fillStyle = COLORS.text;
          for (let i = 0; i <= yTicks; i++) {
            const frac = i / yTicks;
            const y = padT + ch * frac;
            ctx.beginPath();
            ctx.moveTo(padL, y);
            ctx.lineTo(padL + cw, y);
            ctx.stroke();
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillText(yLabels[i], padL - 8 * dpr, y);
          }

          // X labels (years)
          const xTicks = Math.min(years, 10);
          const xStep = years / xTicks;
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          for (let i = 0; i <= xTicks; i++) {
            const year = i * xStep;
            const x = padL + (year / years) * cw;
            ctx.fillText(year === Math.floor(year) ? String(Math.round(year)) : year.toFixed(1), x, padT + ch + 8 * dpr);
          }

          function xScale(t) {
            return padL + (t / years) * cw;
          }
          function yScale(v) {
            return padT + ch - (v / maxY) * ch;
          }

          // Principal baseline (flat)
          ctx.strokeStyle = COLORS.principal;
          ctx.lineWidth = 2 * dpr;
          ctx.setLineDash([6 * dpr, 4 * dpr]);
          ctx.beginPath();
          ctx.moveTo(xScale(0), yScale(P));
          ctx.lineTo(xScale(years), yScale(P));
          ctx.stroke();
          ctx.setLineDash([]);

          // Compound curves (draw lower final balances first so higher curves stay visible)
          const drawOrder = [...seriesList].sort((a, b) => a.finalA - b.finalA);
          drawOrder.forEach(({ series, color }) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5 * dpr;
            ctx.lineJoin = "round";
            ctx.beginPath();
            series.forEach((p, j) => {
              const x = xScale(p.t);
              const y = yScale(p.A);
              if (j === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.stroke();
          });

          seriesList.forEach(({ series, color }) => {
            const last = series[series.length - 1];
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(xScale(last.t), yScale(last.A), 4 * dpr, 0, Math.PI * 2);
            ctx.fill();
          });

          legendEl.innerHTML =
            '<span><i class="principal-line"></i> Principal only (no interest)</span>' +
            seriesList
              .map(
                (s) =>
                  `<span><i class="swatch" style="background:${s.color}"></i> ${formatPct(s.pct)} APR</span>`
              )
              .join("");

          summary.innerHTML = seriesList
            .map((s) => {
              const gainPct = P > 0 ? ((100 * (s.finalA - P)) / P).toFixed(1) : "0";
              return `
            <div class="stat">
              <div class="label">${formatPct(s.pct)} APR · final balance</div>
              <div class="value" style="color:${s.color}">${formatMoney(s.finalA)}</div>
              <div class="label" style="margin-top:0.45rem">Interest earned</div>
              <div class="value secondary" style="color:${s.color}">${formatMoney(s.finalA - P)} <span style="opacity:0.75">(${gainPct}%)</span></div>
            </div>`;
            })
            .join("");
        }

        form.addEventListener("input", draw);
        form.addEventListener("change", draw);
        window.addEventListener("resize", draw);
        draw();
        document.fonts.ready.then(draw);
      })();
    </script>
  </body>
</html>
